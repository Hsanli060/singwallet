name: Release OTA Build & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release Version Tag (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'
      changelog:
        description: 'Changelog / Release Notes'
        required: false
        default: 'SingWallet Android Release with QuickRecordTileService and AI Ingestion'

permissions:
  contents: read

jobs:
  build:
    name: Build Signed Release APK & Manifests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag_name: ${{ steps.version_step.outputs.TAG_NAME }}
      clean_ver: ${{ steps.version_step.outputs.CLEAN_VER }}
      apk_name: ${{ steps.prepare_artifacts.outputs.APK_NAME }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Resolve and Validate Version Tag
        id: version_step
        env:
          INPUT_VERSION_TAG: ${{ github.event.inputs.version_tag }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ -n "$INPUT_VERSION_TAG" ]; then
            TAG_NAME="$INPUT_VERSION_TAG"
          elif [ -n "$REF_NAME" ]; then
            TAG_NAME="$REF_NAME"
          else
            echo "::error::Unable to determine version tag."
            exit 1
          fi

          if ! [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version tag '$TAG_NAME'. Expected format: vX.Y.Z or vX.Y.Z-prerelease"
            exit 1
          fi

          CLEAN_VER="${TAG_NAME#v}"
          BUILD_NUMBER=$((10 + RUN_NUMBER))
          echo "TAG_NAME=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "CLEAN_VER=${CLEAN_VER}" >> "$GITHUB_OUTPUT"
          echo "BUILD_NUMBER=${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Restore Persistent Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing required Android release signing secrets!"
            echo "Please configure all 4 secrets in GitHub Repository Settings -> Secrets and variables -> Actions:"
            echo "  - ANDROID_KEYSTORE_BASE64 (base64-encoded release JKS/keystore)"
            echo "  - KEYSTORE_PASSWORD"
            echo "  - KEY_ALIAS"
            echo "  - KEY_PASSWORD"
            exit 1
          fi

          echo "Decoding persistent release keystore from GitHub Secrets..."
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > android/app/singwallet-release.jks
          if [ ! -s android/app/singwallet-release.jks ]; then
            echo "::error::Decoded keystore android/app/singwallet-release.jks is empty!"
            exit 1
          fi

          {
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'storeFile=singwallet-release.jks\n'
          } > android/key.properties

      - name: Sync Single-Source Web Assets
        run: python tools/sync_web_assets.py

      - name: Build Android Release APK
        env:
          CLEAN_VER: ${{ steps.version_step.outputs.CLEAN_VER }}
          BUILD_NUMBER: ${{ steps.version_step.outputs.BUILD_NUMBER }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PAPP_VERSION_NAME="$CLEAN_VER" \
            -PAPP_VERSION_CODE="$BUILD_NUMBER" \
            --no-daemon

      - name: Prepare Release Artifacts & Generate version.json & web_manifest.json
        id: prepare_artifacts
        env:
          TAG_NAME: ${{ steps.version_step.outputs.TAG_NAME }}
          CLEAN_VER: ${{ steps.version_step.outputs.CLEAN_VER }}
          BUILD_NUMBER: ${{ steps.version_step.outputs.BUILD_NUMBER }}
          REPO_NAME: ${{ github.repository }}
          INPUT_CHANGELOG: ${{ github.event.inputs.changelog }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          APK_ORIGIN="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_ORIGIN" ]; then
            FOUND_APK=$(find android/app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -n 1 || true)
            if [ -n "$FOUND_APK" ] && [ -f "$FOUND_APK" ]; then
              APK_ORIGIN="$FOUND_APK"
            else
              echo "::error::Release APK not found at $APK_ORIGIN"
              exit 1
            fi
          fi

          FINAL_APK_NAME="singwallet-${TAG_NAME}-release.apk"
          cp "$APK_ORIGIN" "$FINAL_APK_NAME"

          APK_SIZE=$(stat -c%s "$FINAL_APK_NAME" 2>/dev/null || stat -f%z "$FINAL_APK_NAME")
          APK_SHA256=$(sha256sum "$FINAL_APK_NAME" | awk '{print $1}')
          DOWNLOAD_URL="https://github.com/${REPO_NAME}/releases/download/${TAG_NAME}/${FINAL_APK_NAME}"
          RELEASE_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          CHANGELOG="$INPUT_CHANGELOG"
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="Release ${TAG_NAME}: Performance optimizations, incremental database schema preservation, and seamless OTA update support."
          fi

          jq -n \
            --arg version "$CLEAN_VER" \
            --arg tagName "$TAG_NAME" \
            --argjson buildNumber "$BUILD_NUMBER" \
            --arg releaseDate "$RELEASE_DATE" \
            --arg changelog "$CHANGELOG" \
            --arg downloadUrl "$DOWNLOAD_URL" \
            --argjson apkSize "$APK_SIZE" \
            --arg sha256 "$APK_SHA256" \
            --arg minCompatibleVersion "1.0.0" \
            '{
              version: $version,
              tagName: $tagName,
              buildNumber: $buildNumber,
              releaseDate: $releaseDate,
              changelog: $changelog,
              downloadUrl: $downloadUrl,
              apkSize: $apkSize,
              sha256: $sha256,
              preserveDataGuaranteed: true,
              minCompatibleVersion: $minCompatibleVersion
            }' > version.json

          echo "Generated version.json:"
          cat version.json

          python3 -c '
          import hashlib, json, os
          from datetime import datetime, timezone
          from pathlib import Path

          web_dir = Path("web")
          files_map = {}
          for p in sorted(web_dir.rglob("*")):
              if p.is_file():
                  rel = p.relative_to(web_dir).as_posix()
                  h = hashlib.sha256()
                  with p.open("rb") as f:
                      while chunk := f.read(65536):
                          h.update(chunk)
                  files_map[rel] = h.hexdigest()

          manifest = {
              "version": os.environ["CLEAN_VER"],
              "commitSha": os.environ["COMMIT_SHA"],
              "generatedAt": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "files": files_map,
          }
          with open("web_manifest.json", "w", encoding="utf-8") as out:
              json.dump(manifest, out, ensure_ascii=False, indent=2)
          '

          echo "Generated web_manifest.json:"
          cat web_manifest.json

          {
            printf '## SingWallet %s\n\n' "$TAG_NAME"
            printf '### 更新说明 (Changelog)\n'
            printf '%s\n\n' "$CHANGELOG"
            printf -- '---\n'
            printf '### 升级不丢数据铁律保障\n'
            printf -- '- **包名锁定**: `com.singwallet.app`\n'
            printf -- '- **持久签名**: 保持一致的 Release 证书覆盖安装\n'
            printf -- '- **无损迁移**: SQLite 数据库增量 `onUpgrade` 迁移机制，严禁 `DROP TABLE`\n'
            printf -- '- **OTA 适配**: 支持 App 内一键静默比对与无缝升级\n'
          } > release_notes.md

          echo "APK_NAME=${FINAL_APK_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: singwallet-release-apk
          path: ${{ steps.prepare_artifacts.outputs.APK_NAME }}

      - name: Upload Release Bundle to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: singwallet-release-bundle
          path: |
            ${{ steps.prepare_artifacts.outputs.APK_NAME }}
            version.json
            web_manifest.json
            release_notes.md

  publish_release:
    name: Publish to GitHub Releases
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Release Bundle
        uses: actions/download-artifact@v4
        with:
          name: singwallet-release-bundle

      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag_name }}
          name: SingWallet ${{ needs.build.outputs.tag_name }}
          body_path: release_notes.md
          files: |
            ${{ needs.build.outputs.apk_name }}
            version.json
            web_manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
