name: CI Quality & Build Gate

on:
  push:
    branches:
      - master
      - main
  pull_request:

permissions:
  contents: read

jobs:
  quality-and-e2e:
    name: Quality, Integrity & Headless E2E
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: tools/requirements.txt

      - name: Install Python Dependencies
        run: python -m pip install -r tools/requirements.txt

      - name: Run Docs & Architecture Integrity Tests
        run: python tools/tests/test_docs_integrity.py

      - name: Run OCR Coordinate Normalization Tests
        run: python tools/tests/test_coordinate_harness.py

      - name: Sync Single-Source Web Assets
        run: python tools/sync_web_assets.py

      - name: Run Headless Browser E2E Suite
        run: python tools/run_browser_tests.py

  android-build-verify:
    name: Android Unit Tests & Debug APK Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync Single-Source Web Assets
        run: python tools/sync_web_assets.py

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Run Android Unit Tests and Assemble Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug -PALLOW_DEBUG_SIGNING=true --no-daemon
